{{- if ne .Release.Name "rc" }}

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-helper-shard
spec:
# https://kubernetes.io/docs/concepts/services-networking/service/#headless-services
  type: ClusterIP
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-helper-shard
  ports:
    - name: mpc
      port: {{ .Values.mpcPort }}
    - name: shard
      port: {{ .Values.shardPort }}

{{- else }}
# ignore this file
{{- end }}
