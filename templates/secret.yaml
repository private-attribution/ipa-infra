apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
{{- $files := .Files }}
{{- $id := trimPrefix "h" .Release.Name }}
{{- range $ix := until (int $.Values.shardCount) }}
  {{- $path := "config/helper%s/shard%d/h%s-helper-shard-%d.h%s-helper-shard.default.svc.cluster.local%s"  }}
  shard-{{ $ix }}.key: |-
    {{- $key_path := printf $path $id $ix $id $ix $id ".key"  }}
{{$files.Get $key_path | indent 4 }}
  shard-{{ $ix }}_mk.key: |-
    {{- $mk_key_path := printf $path $id $ix $id $ix $id "_mk.key"  }}
{{$files.Get $mk_key_path | indent 4 }}
{{- end }}
